[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iicu_activity_journal"
version = "0.6.0"
authors = [
  { name="yokuha", email="jokuha@icloud.com" },
]
description = "Back up intervals.icu data and create logbooks from it"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "click",
  "mdutils",
  "requests",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
balance = ["matplotlib", "numpy", "scipy"]
dev = ["pytest", "ruff"]

[project.urls]
homepage = "https://github.com/yokuha/activity-journal"
issues = "https://github.com/yokuha/activity-journal/issues"

[project.scripts]
iicu-journal = "iicu_activity_journal.cli:main"
# Legacy commands, replaced by `iicu-journal` in the next steps.
iicu-activity-journal-create = "iicu_activity_journal.create:main"
iicu-activity-journal-update-data = "iicu_activity_journal.update_data:main"
iicu-activity-journal-balance = "iicu_activity_journal.plot_balance:main"
iicu-activity-journal-duplicates = "iicu_activity_journal.duplicates:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iicu_activity_journal = ["pandoc.yaml", "emoji.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
